<!DOCTYPE html>

<html lang="fr">
<head>
<meta charset="UTF-8">
<title>Breaking Stab — Version Pro</title>
<style>
  body { font-family: Inter, sans-serif; margin:0; background:#f4f8fb; color:#172637; }
  header { padding:20px; background:#1d5f8f; color:white; text-align:center; }
  h1 { margin:0; font-size:2rem; }
  .tabs { display:flex; gap:10px; margin:20px; }
  .tab-button { padding:6px 12px; border-radius:8px; border:none; cursor:pointer; background:white; color:#1d5f8f; font-weight:bold; }
  .tab-button.active { background:#1d5f8f; color:white; }
  .panel { display:none; padding:10px 20px; }
  .panel.active { display:block; }
  .filters { display:flex; flex-wrap:wrap; gap:10px; margin-bottom:10px; }
  select,input,button { padding:6px 10px; border-radius:8px; border:1px solid #cddbe8; }
  .results { display:grid; gap:10px; margin-bottom:20px; }
  .stab-card { background:white; padding:10px; border-radius:12px; border:1px solid #cddbe8; box-shadow:0 4px 12px rgba(23,38,55,0.1); }
  .pill { display:inline-block; padding:4px 8px; border-radius:12px; margin:2px; font-size:0.82rem; font-weight:bold; }
  .pill.device { background:#e3f0fb; color:#1d5f8f; }
  .pill.solvent { background:#e6efe8; color:#315f46; }
  .stab-bar { height:8px; border-radius:999px; background:#ebe5d9; margin-top:4px; overflow:hidden; position:relative; }
  .stab-fill { height:100%; border-radius:inherit; display:block; }
  .stab-fill.ok { background:#6ea77a; }
  .stab-fill.warn { background:#d6a64b; }
  .stab-fill.stop { background:#c85a4a; }
</style>
</head>
<body>
<header>
<h1>Breaking Stab — Version Professionnelle</h1>
<p>Stabilité des perfusions et compatibilités en Y</p>
</header>
<div class="tabs">
<button class="tab-button active" data-tab="stabTab">Stabilité</button>
<button class="tab-button" data-tab="compareTab">Comparaison sources</button>
<button class="tab-button" data-tab="ycompatTab">Compatibilité Y</button>
<button class="tab-button" data-tab="reverseTab">Moteur inversé</button>
</div>

<section id="stabTab" class="panel active">
<div class="filters">
<select id="sourceFilter"><option value="">Toutes les sources actives</option></select>
<input id="searchMolecule" type="search" placeholder="Recherche molécule…" />
<button id="refreshBtn">Recharger Excel</button>
</div>
<div class="results" id="stabResults"></div>
</section>

<section id="compareTab" class="panel">
<div id="compareResults" class="results"></div>
</section>

<section id="ycompatTab" class="panel">
<div class="filters">
<input id="searchYPrimary" placeholder="Molécule principale" />
<input id="searchYSecondary" placeholder="Molécule co-admin" />
</div>
<div id="yResults" class="results"></div>
</section>

<section id="reverseTab" class="panel">
<div class="filters">
<input id="revMolecule" placeholder="Molécule" />
<input id="revDose" type="number" placeholder="Dose" />
<select id="revMode"><option value="continuous">Continu</option><option value="discontinuous">Discontinu</option></select>
<select id="revFreq"><option value="1">1x/j</option><option value="2">2x/j</option><option value="3">3x/j</option></select>
<button id="revRun">Calculer</button>
</div>
<div id="revResults" class="results"></div>
</section>

<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>

<script>
const stabExcel = 'breaking_stab_database_v2_sources_toggle.xlsx';
const yExcel = 'breaking_stab_Y_compatibility_final.xlsx';
let stabData=[], yData=[];

const tabs = document.querySelectorAll('.tab-button');
tabs.forEach(t=>t.addEventListener('click',()=>{
  tabs.forEach(b=>b.classList.remove('active'));
  t.classList.add('active');
  document.querySelectorAll('.panel').forEach(p=>p.classList.remove('active'));
  document.getElementById(t.dataset.tab).classList.add('active');
}));

async function loadExcel(){
  // Stabilité
  let resp = await fetch(stabExcel);
  let data = await resp.arrayBuffer();
  let wb = XLSX.read(data,{type:'array'});
  stabData = XLSX.utils.sheet_to_json(wb.Sheets['Stability']).filter(r=>r.source_enabled==='Oui');
  populateSourceFilter();
  renderStab(stabData);

  // Compatibilité Y
  resp = await fetch(yExcel);
  data = await resp.arrayBuffer();
  wb = XLSX.read(data,{type:'array'});
  yData = XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]]);
  renderY(yData);
}

function populateSourceFilter(){
  const sel = document.getElementById('sourceFilter');
  const sset = new Set(stabData.map(d=>d.source_name));
  sel.innerHTML='<option value="">Toutes les sources actives</option>';
  sset.forEach(s=>{const o=document.createElement('option');o.value=s;o.textContent=s;sel.appendChild(o);});
}

function renderStab(data){
  const container=document.getElementById('stabResults');
  container.innerHTML='';
  data.forEach(d=>{
    const card=document.createElement('div');
    card.className='stab-card';
    const deviceSummary = `${d.device} ${d.solvent} ${d.concentration_min||''}-${d.concentration_max||''}${d.concentration_unit||''}`;
    const barClass = d.stability_duration_h>=24?'ok':d.stability_duration_h>=12?'warn':'stop';
    card.innerHTML=`<strong>${d.molecule}</strong> — Source: ${d.source_name}<br>
      <span class='pill device'>${deviceSummary}</span>
      <div class='stab-bar'><span class='stab-fill ${barClass}' style='width:${Math.min(d.stability_duration_h*4,100)}%'></span></div>`;
    container.appendChild(card);
  });
}

document.getElementById('sourceFilter').addEventListener('change',e=>{
  const val=e.target.value;
  renderStab(val? stabData.filter(d=>d.source_name===val): stabData);
});
document.getElementById('searchMolecule').addEventListener('input',e=>{
  const term=e.target.value.toLowerCase();
  renderStab(stabData.filter(d=>d.molecule.toLowerCase().includes(term)));
});

function renderY(data){
  const container=document.getElementById('yResults');
  container.innerHTML='';
  data.forEach(d=>{
    const card=document.createElement('div');
    card.className='stab-card';
    const compClass=d.compatible==='compatible'?'ok':d.compatible==='warn'?'warn':'stop';
    card.innerHTML=`<strong>${d.molecule_primary}</strong> + <strong>${d.molecule_Y}</strong> — Device: ${d.device}<br>
      <span class='stab-bar'><span class='stab-fill ${compClass}' style='width:100%'></span></span><br>
      Source: ${d.source_name}`;
    container.appendChild(card);
  });
}
document.getElementById('searchYPrimary').addEventListener('input', e=>{
  const term=e.target.value.toLowerCase();
  renderY(yData.filter(d=>d.molecule_primary.toLowerCase().includes(term)));
});
document.getElementById('searchYSecondary').addEventListener('input', e=>{
  const term=e.target.value.toLowerCase();
  renderY(yData.filter(d=>d.molecule_Y.toLowerCase().includes(term)));
});
document.getElementById('revRun').addEventListener('click',()=>{
  const mol=document.getElementById('revMolecule').value;
  const dose=parseFloat(document.getElementById('revDose').value);
  const mode=document.getElementById('revMode').value;
  const freq=parseInt(document.getElementById('revFreq').value);
  const revContainer=document.getElementById('revResults');
  const filtered=stabData.filter(d=>d.molecule===mol && ((mode==='continuous' && d.continuous_possible==='TRUE') || (mode==='discontinuous' && d.discontinuous_possible==='TRUE')));
  revContainer.innerHTML='';
  filtered.forEach(d=>{
    const volumes=d.volume_min && d.volume_max?`${d.volume_min}-${d.volume_max} mL`:'variable';
    const card=document.createElement('div');
    card.className='stab-card';
    card.innerHTML=`<strong>${d.molecule}</strong> — ${d.device} — Solvent: ${d.solvent} — Dose possible: ${volumes} — Temp Max: ${d.temperature_max} — Durée: ${d.stability_duration_h}h`;
    revContainer.appendChild(card);
  });
});

loadExcel();
</script>

</body>
</html>
